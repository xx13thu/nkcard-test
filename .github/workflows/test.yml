name: Test PaddleOCR Logic

on:
  workflow_dispatch: # 仅允许手动运行

jobs:
  test-ocr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow numpy opencv-python-headless paddlepaddle paddleocr

      - name: Cache PaddleOCR Models
        uses: actions/cache@v4
        with:
          path: ~/.paddleocr
          key: ${{ runner.os }}-paddleocr-models

      - name: Run Test Script
        run: python test_paddle_ocr.py
